<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Site{% endblock %}</title>
    <!-- Bootstrap CDN for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'home' %}">MyApp</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'item_list' %}">Items</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'login' %}">Login</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
    {% block content %}
    <div class="text-center">
        <h1 class="display-4 fw-bold mb-4">Welcome to My Django App</h1>
        <p class="lead">This platform lets you manage and explore your items with ease.</p>
        <hr class="my-4">
        <p>Use the navigation bar above to browse items, log in, or return to the homepage.</p>
        <p class="mt-4">
            <a href="{% url 'item_list' %}" class="btn btn-primary btn-lg">View Items</a>
            <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-lg">Login</a>
        </p>
    </div> 
    {% endblock %}
</div>

<!-- Bootstrap JS (for navbar toggle on mobile) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
