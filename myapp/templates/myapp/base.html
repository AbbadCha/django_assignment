<body>
    <div class="container">
        <div class="user-info">
            {% if user.is_authenticated %}
                Hello, {{ user.username }}! 
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </div>
        
        {% block content %}
        {% endblock %}
    </div>
</body>
